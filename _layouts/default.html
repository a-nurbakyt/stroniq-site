<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{% seo %}
<link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
</head>
<body>
<div class="sheet">

<div class="topbar">
  <div class="bar">
    <a class="wordmark" href="{{ '/' | relative_url }}" aria-label="Stroniq">
      <span aria-hidden="true">S</span>
      <!-- T как инженерный узел: ригель, стойка, косынки и шарнир -->
      <svg class="nodeT" viewBox="0 0 104 120" aria-hidden="true">
        <path class="bar" d="M0 0h104v18H0z"/>
        <path class="stem" d="M40 16h24v104H40z"/>
        <circle class="pin" cx="52" cy="34" r="13"/>
      </svg>
      <span aria-hidden="true">RONIQ</span>
    </a>
    <button class="burger" aria-expanded="false" aria-controls="nav" aria-label="Меню">
      <span></span><span></span><span></span>
    </button>
    <nav class="nav" id="nav">
      <a href="{{ '/publications/' | relative_url }}">Публикации</a>
      <a href="{{ site.app_url }}" target="_blank" rel="noopener">Калькуляторы</a>
      <a href="{{ '/about.html' | relative_url }}">О проекте</a>
    </nav>
  </div>
</div>

{{ content }}

<footer class="foot">
  <div class="grid">
    <div class="cell">
      <span class="lbl">Stroniq</span>
      <p style="font-size:15px;color:var(--muted);max-width:34ch;line-height:1.6">
        Инструменты и знания для инженеров-конструкторов.</p>
    </div>
    <div class="cell">
      <span class="lbl">Разделы</span>
      <a href="{{ '/publications/' | relative_url }}">Публикации</a>
      <a href="{{ site.app_url }}" target="_blank" rel="noopener">Калькуляторы</a>
      <a href="{{ '/about.html' | relative_url }}">О проекте</a>
    </div>
    <div class="cell">
      <span class="lbl">Контакты</span>
      <a href="mailto:nurbakyt.aigul@gmail.com">nurbakyt.aigul@gmail.com</a>
    </div>
  </div>
  <div class="copy">
    <span>© 2026 Stroniq</span>
    <span>СП РК EN 1991-1-3 · 1991-1-4</span>
  </div>
</footer>

</div>
<script>
// Мобильное меню
const b=document.querySelector('.burger'),n=document.getElementById('nav');
b&&b.addEventListener('click',()=>{const o=b.getAttribute('aria-expanded')==='true';
  b.setAttribute('aria-expanded',!o);n.classList.toggle('open',!o)});
// Появление секций при скролле
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){
  e.target.classList.add('on');io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
{% seo %}
<link rel="stylesheet" href="{{ '/css/style.css' | relative_url }}">
</head>
<body>
<div class="sheet">

<header class="stamp">
  <div class="brand"><a href="{{ '/' | relative_url }}">STRONIQ<span class="dot">.</span></a></div>
  <nav>
    <a href="{{ '/about.html' | relative_url }}">О проекте</a>
    <a href="{{ '/blog/' | relative_url }}">Публикации</a>
    <a class="cta" href="{{ '/calc.html' | relative_url }}">Калькулятор</a>
  </nav>
</header>

{{ content }}

<footer class="stamp">
  <div class="row">
    <div class="cell"><span class="lbl">Проект</span>Stroniq — сбор нагрузок по СП РК EN</div>
    <div class="cell"><span class="lbl">Разработала</span>Айгуль Нурбакыт, инженер</div>
    <div class="cell"><span class="lbl">Калькулятор</span><a href="{{ '/calc.html' | relative_url }}">открыть →</a></div>
  </div>
  <div class="row">
    <div class="cell"><span class="lbl">Нормы</span>СП РК EN 1991-1-3 · 1991-1-4 · 1990</div>
    <div class="cell"><span class="lbl">О проекте</span><a href="{{ '/about.html' | relative_url }}">история →</a></div>
    <div class="cell"><span class="lbl">Публикации</span><a href="{{ '/blog/' | relative_url }}">все →</a></div>
  </div>
</footer>

</div>
<script>
// Плавное появление секций при скролле (уважает reduced-motion через CSS)
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('on');io.unobserve(e.target)}}),{threshold:.12});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
</script>
</body>
</html>

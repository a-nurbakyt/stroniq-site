<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" width="100%" role="img" aria-labelledby="t3 d3">
<title id="t3">Базовая высота и форма профиля скоростного напора</title>
<desc id="d3">Три случая: высота не более ширины наветренной грани — одна полоса; высота между b и 2b — две полосы; высота более 2b — нижняя и верхняя полосы высотой b и промежуточные полосы между ними. Для каждой полосы напор принимается равномерно распределённым.</desc>

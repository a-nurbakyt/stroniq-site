<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" width="100%" role="img" aria-labelledby="t d">
  <title id="t">Последовательность расчёта ветровой нагрузки по СП РК EN 1991-1-4</title>
  <desc id="d">Шесть этапов расчёта: основное значение базовой скорости, базовая скорость, средняя скорость на высоте, пиковый скоростной напор, давление на поверхности, суммарная сила. Для каждого этапа указаны размерность, номер формулы и исходные данные.</desc>

  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
    </marker>
    <style>
      .sym  { font-family: Georgia, "Times New Roman", serif; font-style: italic; font-size: 21px; fill: #1a1a1a; }
      .unit { font-family: system-ui, "Helvetica Neue", Arial, sans-serif; font-size: 12px; fill: #6b6b6b; letter-spacing: .02em; }
      .name { font-family: system-ui, "Helvetica Neue", Arial, sans-serif; font-size: 14.5px; fill: #1a1a1a; }
      .ref  { font-family: system-ui, "Helvetica Neue", Arial, sans-serif; font-size: 12.5px; fill: #6b6b6b; }
      .inp  { font-family: system-ui, "Helvetica Neue", Arial, sans-serif; font-size: 12.5px; fill: #6b6b6b; }
      .hd   { font-family: system-ui, "Helvetica Neue", Arial, sans-serif; font-size: 10.5px; fill: #8a8a8a; letter-spacing: .12em; }
      .band { font-family: system-ui, "Helvetica Neue", Arial, sans-serif; font-size: 10.5px; fill: #b3502a; letter-spacing: .14em; }
      .ttl  { font-family: system-ui, "Helvetica Neue", Arial, sans-serif; font-size: 15px; fill: #1a1a1a; letter-spacing: .02em; }
      .box  { fill: #ffffff; stroke: #1a1a1a; stroke-width: 1.1; }
      .rule { stroke: #d8d8d8; stroke-width: 1; }
      .flow { stroke: #1a1a1a; stroke-width: 1.4; }
    </style>
  </defs>

  <text class="ttl" x="60" y="34">Последовательность расчёта ветровой нагрузки</text>
  <line class="rule" x1="60" y1="50" x2="700" y2="50"/>

  <text class="hd" x="60" y="76">ВЕЛИЧИНА</text>
  <text class="hd" x="300" y="76">ЧТО ОПРЕДЕЛЯЕТСЯ</text>
  <text class="hd" x="576" y="76">ИСХОДНЫЕ ДАННЫЕ</text>
  <line class="rule" x1="60" y1="86" x2="700" y2="86"/>

  <!-- bands -->
  <line x1="34" y1="102" x2="34" y2="284" stroke="#b3502a" stroke-width="1.2"/>
  <text class="band" x="26" y="193" transform="rotate(-90 26 193)" text-anchor="middle">КЛИМАТ</text>
  <line x1="34" y1="300" x2="34" y2="482" stroke="#b3502a" stroke-width="1.2"/>
  <text class="band" x="26" y="391" transform="rotate(-90 26 391)" text-anchor="middle">ПЛОЩАДКА</text>
  <line x1="34" y1="498" x2="34" y2="680" stroke="#b3502a" stroke-width="1.2"/>
  <text class="band" x="26" y="589" transform="rotate(-90 26 589)" text-anchor="middle">ЗДАНИЕ</text>

  <!-- 1 -->
  <rect class="box" x="60" y="102" width="216" height="62"/>
  <text class="sym" x="78" y="132">v<tspan font-size="13" dy="5">b,0</tspan></text>
  <text class="unit" x="78" y="154">м/с</text>
  <text class="name" x="300" y="127">Основное значение базовой скорости</text>
  <text class="ref"  x="300" y="147">Карта 10 НП · п. 4.2(1)Р</text>
  <text class="inp"  x="576" y="137">район строительства</text>

  <line class="flow" x1="168" y1="164" x2="168" y2="196" marker-end="url(#ar)"/>

  <!-- 2 -->
  <rect class="box" x="60" y="200" width="216" height="62"/>
  <text class="sym" x="78" y="230">v<tspan font-size="13" dy="5">b</tspan></text>
  <text class="unit" x="78" y="252">м/с</text>
  <text class="name" x="300" y="225">Базовая скорость ветра</text>
  <text class="ref"  x="300" y="245">формула (4.1)</text>
  <text class="inp"  x="576" y="228">c</text>
  <text class="inp"  x="583" y="231" font-size="10">dir</text>
  <text class="inp"  x="597" y="228">, c</text>
  <text class="inp"  x="611" y="231" font-size="10">season</text>
  <text class="inp"  x="576" y="248">(в РК = 1,0)</text>

  <line class="flow" x1="168" y1="262" x2="168" y2="294" marker-end="url(#ar)"/>

  <!-- 3 -->
  <rect class="box" x="60" y="298" width="216" height="62"/>
  <text class="sym" x="78" y="328">v<tspan font-size="13" dy="5">m</tspan><tspan font-size="21" dy="-5">(z)</tspan></text>
  <text class="unit" x="78" y="350">м/с</text>
  <text class="name" x="300" y="323">Средняя скорость на отметке z</text>
  <text class="ref"  x="300" y="343">формулы (4.3)–(4.5)</text>
  <text class="inp"  x="576" y="323">категория местности,</text>
  <text class="inp"  x="576" y="341">z₀, z_min, рельеф</text>

  <line class="flow" x1="168" y1="360" x2="168" y2="392" marker-end="url(#ar)"/>

  <!-- 4 -->
  <rect class="box" x="60" y="396" width="216" height="62"/>
  <text class="sym" x="78" y="426">q<tspan font-size="13" dy="5">p</tspan><tspan font-size="21" dy="-5">(z)</tspan></text>
  <text class="unit" x="78" y="448">Н/м²</text>
  <text class="name" x="300" y="421">Пиковый скоростной напор</text>
  <text class="ref"  x="300" y="441">формулы (4.7), (4.8)</text>
  <text class="inp"  x="576" y="421">турбулентность,</text>
  <text class="inp"  x="576" y="439">ρ = 1,25 кг/м³</text>

  <line class="flow" x1="168" y1="458" x2="168" y2="490" marker-end="url(#ar)"/>

  <!-- 5 -->
  <rect class="box" x="60" y="494" width="216" height="62"/>
  <text class="sym" x="78" y="524">w<tspan font-size="13" dy="5">e</tspan><tspan font-size="21" dy="-5"> / </tspan>w<tspan font-size="13" dy="5">i</tspan></text>
  <text class="unit" x="78" y="546">Н/м²</text>
  <text class="name" x="300" y="519">Давление на поверхности</text>
  <text class="ref"  x="300" y="539">формулы (5.1), (5.2)</text>
  <text class="inp"  x="576" y="519">зоны, площадь</text>
  <text class="inp"  x="576" y="537">загружения, проёмы</text>

  <line class="flow" x1="168" y1="556" x2="168" y2="588" marker-end="url(#ar)"/>

  <!-- 6 -->
  <rect class="box" x="60" y="592" width="216" height="62" stroke-width="2"/>
  <text class="sym" x="78" y="622">F<tspan font-size="13" dy="5">w</tspan></text>
  <text class="unit" x="78" y="644">Н</text>
  <text class="name" x="300" y="617">Суммарное ветровое воздействие</text>
  <text class="ref"  x="300" y="637">формула (5.3)</text>
  <text class="inp"  x="576" y="617">c</text>
  <text class="inp"  x="583" y="620" font-size="10">s</text>
  <text class="inp"  x="589" y="617">c</text>
  <text class="inp"  x="596" y="620" font-size="10">d</text>
  <text class="inp"  x="602" y="617">, c</text>
  <text class="inp"  x="616" y="620" font-size="10">f</text>
  <text class="inp"  x="620" y="617">, A</text>
  <text class="inp"  x="634" y="620" font-size="10">ref</text>

  <line class="rule" x1="60" y1="676" x2="700" y2="676"/>
  <text class="hd" x="60" y="694">STRONIQ · СП РК EN 1991-1-4:2005/2011 И НАЦИОНАЛЬНОЕ ПРИЛОЖЕНИЕ</text>
</svg>

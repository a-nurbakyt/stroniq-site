<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 700" width="100%" role="img" aria-labelledby="t2 d2">
<title id="t2">Зоны вертикальных стен A, B, C</title>
<desc id="d2">План здания с направлением ветра и гранями D и E, и три вида сбоку боковой стены с зонами A, B, C для случаев e меньше d, e больше d и e больше пяти d.</desc>
<defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9" fill="none" stroke="#1a1a1a" stroke-width="1.4"/></marker>
    <marker id="dm" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2,2 L8,5 L2,8" fill="none" stroke="#6b6b6b" stroke-width="1"/></marker>
    <style>
      .lbl {font-family:system-ui,"Helvetica Neue",Arial,sans-serif;font-size:12.5px;fill:#1a1a1a;}
      .mut {font-family:system-ui,"Helvetica Neue",Arial,sans-serif;font-size:11.5px;fill:#6b6b6b;}
      .hd  {font-family:system-ui,"Helvetica Neue",Arial,sans-serif;font-size:10.5px;fill:#8a8a8a;letter-spacing:.12em;}
      .ttl {font-family:system-ui,"Helvetica Neue",Arial,sans-serif;font-size:15px;fill:#1a1a1a;}
      .frm {font-family:Georgia,"Times New Roman",serif;font-size:15px;fill:#1a1a1a;}
      .zone{font-family:system-ui,"Helvetica Neue",Arial,sans-serif;font-size:14px;font-weight:600;fill:#1a1a1a;}
      .case{font-family:system-ui,"Helvetica Neue",Arial,sans-serif;font-size:12.5px;fill:#b3502a;}
      .rule{stroke:#d8d8d8;stroke-width:1;}
      .bld {fill:#ffffff;stroke:#1a1a1a;stroke-width:1.2;}
      .div {stroke:#1a1a1a;stroke-width:1;} .dim{stroke:#6b6b6b;stroke-width:.9;}
      .grd {stroke:#1a1a1a;stroke-width:1.4;}
    </style></defs>
<text class="ttl" x="60" y="34">Зоны вертикальных стен</text>
<line class="rule" x1="60" y1="50" x2="700" y2="50"/>
<text class="frm" x="60" y="76">e = b или 2h — определяющим является меньшее значение</text>
<text class="mut" x="60" y="96">b — размер конструкции по нормали к направлению действия ветра; d — размер вдоль потока; h — высота</text>
<text class="hd" x="88" y="132">ПЛАН</text>
<rect class="bld" x="88" y="150" width="168" height="116"/>
<line class="div" x1="42" y1="180" x2="80" y2="180" marker-end="url(#ar)"/>
<line class="div" x1="42" y1="208" x2="80" y2="208" marker-end="url(#ar)"/>
<line class="div" x1="42" y1="236" x2="80" y2="236" marker-end="url(#ar)"/>
<text class="mut" x="42" y="144">ветер</text>
<text class="lbl" x="96" y="212">D</text>
<text class="lbl" x="240" y="212">E</text>
<line class="dim" x1="88.0" y1="134.0" x2="256.0" y2="134.0" marker-start="url(#dm)" marker-end="url(#dm)"/><text class="mut" x="172.0" y="128" text-anchor="middle">d</text>
<line class="dim" x1="272.0" y1="150.0" x2="272.0" y2="266.0" marker-start="url(#dm)" marker-end="url(#dm)"/><text class="mut" x="280" y="212.0">b</text>
<text class="mut" x="88" y="292">Зоны A, B, C относятся к боковой стене</text>
<text class="mut" x="88" y="310">и откладываются вдоль размера d.</text>
<text class="mut" x="88" y="342">Зонирование выполняется отдельно для</text>
<text class="mut" x="88" y="360">каждого направления ветра: при повороте</text>
<text class="mut" x="88" y="378">потока на 90° размеры b и d меняются</text>
<text class="mut" x="88" y="396">местами, вместе с ними меняется e.</text>
<text class="case" x="330" y="136">Вид сбоку при e &lt; d</text>
<rect class="bld" x="330" y="150" width="360" height="72"/>
<text class="zone" x="351.6" y="193" text-anchor="middle">A</text>
<line class="div" x1="373.2" y1="150" x2="373.2" y2="222"/>
<text class="zone" x="459.6" y="193" text-anchor="middle">B</text>
<line class="div" x1="546.0" y1="150" x2="546.0" y2="222"/>
<text class="zone" x="618.0" y="193" text-anchor="middle">C</text>
<line class="grd" x1="316" y1="222" x2="704" y2="222"/><line class="dim" x1="316" y1="222" x2="310" y2="229"/><line class="dim" x1="327" y1="222" x2="321" y2="229"/><line class="dim" x1="338" y1="222" x2="332" y2="229"/><line class="dim" x1="349" y1="222" x2="343" y2="229"/><line class="dim" x1="360" y1="222" x2="354" y2="229"/><line class="dim" x1="371" y1="222" x2="365" y2="229"/><line class="dim" x1="382" y1="222" x2="376" y2="229"/><line class="dim" x1="393" y1="222" x2="387" y2="229"/><line class="dim" x1="404" y1="222" x2="398" y2="229"/><line class="dim" x1="415" y1="222" x2="409" y2="229"/><line class="dim" x1="426" y1="222" x2="420" y2="229"/><line class="dim" x1="437" y1="222" x2="431" y2="229"/><line class="dim" x1="448" y1="222" x2="442" y2="229"/><line class="dim" x1="459" y1="222" x2="453" y2="229"/><line class="dim" x1="470" y1="222" x2="464" y2="229"/><line class="dim" x1="481" y1="222" x2="475" y2="229"/><line class="dim" x1="492" y1="222" x2="486" y2="229"/><line class="dim" x1="503" y1="222" x2="497" y2="229"/><line class="dim" x1="514" y1="222" x2="508" y2="229"/><line class="dim" x1="525" y1="222" x2="519" y2="229"/><line class="dim" x1="536" y1="222" x2="530" y2="229"/><line class="dim" x1="547" y1="222" x2="541" y2="229"/><line class="dim" x1="558" y1="222" x2="552" y2="229"/><line class="dim" x1="569" y1="222" x2="563" y2="229"/><line class="dim" x1="580" y1="222" x2="574" y2="229"/><line class="dim" x1="591" y1="222" x2="585" y2="229"/><line class="dim" x1="602" y1="222" x2="596" y2="229"/><line class="dim" x1="613" y1="222" x2="607" y2="229"/><line class="dim" x1="624" y1="222" x2="618" y2="229"/><line class="dim" x1="635" y1="222" x2="629" y2="229"/><line class="dim" x1="646" y1="222" x2="640" y2="229"/><line class="dim" x1="657" y1="222" x2="651" y2="229"/><line class="dim" x1="668" y1="222" x2="662" y2="229"/><line class="dim" x1="679" y1="222" x2="673" y2="229"/><line class="dim" x1="690" y1="222" x2="684" y2="229"/>
<line class="dim" x1="330.0" y1="252.0" x2="373.2" y2="252.0" marker-start="url(#dm)" marker-end="url(#dm)"/><text class="mut" x="351.6" y="246" text-anchor="middle">e/5</text>
<line class="dim" x1="373.2" y1="252.0" x2="546.0" y2="252.0" marker-start="url(#dm)" marker-end="url(#dm)"/><text class="mut" x="459.6" y="246" text-anchor="middle">4e/5</text>
<line class="dim" x1="546.0" y1="252.0" x2="690.0" y2="252.0" marker-start="url(#dm)" marker-end="url(#dm)"/><text class="mut" x="618.0" y="246" text-anchor="middle">d − e</text>
<line class="dim" x1="330.0" y1="276.0" x2="690.0" y2="276.0" marker-start="url(#dm)" marker-end="url(#dm)"/><text class="mut" x="510.0" y="270" text-anchor="middle">d</text>
<text class="mut" x="330" y="298">три зоны: A, B, C</text>
<text class="case" x="330" y="322">Вид сбоку при e &gt; d</text>
<rect class="bld" x="330" y="336" width="360" height="72"/>
<text class="zone" x="373.2" y="379" text-anchor="middle">A</text>
<line class="div" x1="416.4" y1="336" x2="416.4" y2="408"/>
<text class="zone" x="553.2" y="379" text-anchor="middle">B</text>
<line class="grd" x1="316" y1="408" x2="704" y2="408"/><line class="dim" x1="316" y1="408" x2="310" y2="415"/><line class="dim" x1="327" y1="408" x2="321" y2="415"/><line class="dim" x1="338" y1="408" x2="332" y2="415"/><line class="dim" x1="349" y1="408" x2="343" y2="415"/><line class="dim" x1="360" y1="408" x2="354" y2="415"/><line class="dim" x1="371" y1="408" x2="365" y2="415"/><line class="dim" x1="382" y1="408" x2="376" y2="415"/><line class="dim" x1="393" y1="408" x2="387" y2="415"/><line class="dim" x1="404" y1="408" x2="398" y2="415"/><line class="dim" x1="415" y1="408" x2="409" y2="415"/><line class="dim" x1="426" y1="408" x2="420" y2="415"/><line class="dim" x1="437" y1="408" x2="431" y2="415"/><line class="dim" x1="448" y1="408" x2="442" y2="415"/><line class="dim" x1="459" y1="408" x2="453" y2="415"/><line class="dim" x1="470" y1="408" x2="464" y2="415"/><line class="dim" x1="481" y1="408" x2="475" y2="415"/><line class="dim" x1="492" y1="408" x2="486" y2="415"/><line class="dim" x1="503" y1="408" x2="497" y2="415"/><line class="dim" x1="514" y1="408" x2="508" y2="415"/><line class="dim" x1="525" y1="408" x2="519" y2="415"/><line class="dim" x1="536" y1="408" x2="530" y2="415"/><line class="dim" x1="547" y1="408" x2="541" y2="415"/><line class="dim" x1="558" y1="408" x2="552" y2="415"/><line class="dim" x1="569" y1="408" x2="563" y2="415"/><line class="dim" x1="580" y1="408" x2="574" y2="415"/><line class="dim" x1="591" y1="408" x2="585" y2="415"/><line class="dim" x1="602" y1="408" x2="596" y2="415"/><line class="dim" x1="613" y1="408" x2="607" y2="415"/><line class="dim" x1="624" y1="408" x2="618" y2="415"/><line class="dim" x1="635" y1="408" x2="629" y2="415"/><line class="dim" x1="646" y1="408" x2="640" y2="415"/><line class="dim" x1="657" y1="408" x2="651" y2="415"/><line class="dim" x1="668" y1="408" x2="662" y2="415"/><line class="dim" x1="679" y1="408" x2="673" y2="415"/><line class="dim" x1="690" y1="408" x2="684" y2="415"/>
<line class="dim" x1="330.0" y1="438.0" x2="416.4" y2="438.0" marker-start="url(#dm)" marker-end="url(#dm)"/><text class="mut" x="373.2" y="432" text-anchor="middle">e/5</text>
<line class="dim" x1="416.4" y1="438.0" x2="690.0" y2="438.0" marker-start="url(#dm)" marker-end="url(#dm)"/><text class="mut" x="553.2" y="432" text-anchor="middle">d − e/5</text>
<line class="dim" x1="330.0" y1="462.0" x2="690.0" y2="462.0" marker-start="url(#dm)" marker-end="url(#dm)"/><text class="mut" x="510.0" y="456" text-anchor="middle">d</text>
<text class="mut" x="330" y="484">зона C отсутствует</text>
<text class="case" x="330" y="508">Вид сбоку при e &gt; 5d</text>
<rect class="bld" x="330" y="522" width="360" height="72"/>
<text class="zone" x="510.0" y="565" text-anchor="middle">A</text>
<line class="grd" x1="316" y1="594" x2="704" y2="594"/><line class="dim" x1="316" y1="594" x2="310" y2="601"/><line class="dim" x1="327" y1="594" x2="321" y2="601"/><line class="dim" x1="338" y1="594" x2="332" y2="601"/><line class="dim" x1="349" y1="594" x2="343" y2="601"/><line class="dim" x1="360" y1="594" x2="354" y2="601"/><line class="dim" x1="371" y1="594" x2="365" y2="601"/><line class="dim" x1="382" y1="594" x2="376" y2="601"/><line class="dim" x1="393" y1="594" x2="387" y2="601"/><line class="dim" x1="404" y1="594" x2="398" y2="601"/><line class="dim" x1="415" y1="594" x2="409" y2="601"/><line class="dim" x1="426" y1="594" x2="420" y2="601"/><line class="dim" x1="437" y1="594" x2="431" y2="601"/><line class="dim" x1="448" y1="594" x2="442" y2="601"/><line class="dim" x1="459" y1="594" x2="453" y2="601"/><line class="dim" x1="470" y1="594" x2="464" y2="601"/><line class="dim" x1="481" y1="594" x2="475" y2="601"/><line class="dim" x1="492" y1="594" x2="486" y2="601"/><line class="dim" x1="503" y1="594" x2="497" y2="601"/><line class="dim" x1="514" y1="594" x2="508" y2="601"/><line class="dim" x1="525" y1="594" x2="519" y2="601"/><line class="dim" x1="536" y1="594" x2="530" y2="601"/><line class="dim" x1="547" y1="594" x2="541" y2="601"/><line class="dim" x1="558" y1="594" x2="552" y2="601"/><line class="dim" x1="569" y1="594" x2="563" y2="601"/><line class="dim" x1="580" y1="594" x2="574" y2="601"/><line class="dim" x1="591" y1="594" x2="585" y2="601"/><line class="dim" x1="602" y1="594" x2="596" y2="601"/><line class="dim" x1="613" y1="594" x2="607" y2="601"/><line class="dim" x1="624" y1="594" x2="618" y2="601"/><line class="dim" x1="635" y1="594" x2="629" y2="601"/><line class="dim" x1="646" y1="594" x2="640" y2="601"/><line class="dim" x1="657" y1="594" x2="651" y2="601"/><line class="dim" x1="668" y1="594" x2="662" y2="601"/><line class="dim" x1="679" y1="594" x2="673" y2="601"/><line class="dim" x1="690" y1="594" x2="684" y2="601"/>
